name: Validate and publish VLIS demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlis-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/demo-data.js
          node --check docs/assets/vlis.js
          node --check qa/check-ui.cjs
      - name: Install browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/vlis-qa" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/vlis-qa/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Check prototype interactions and responsive layout
        run: node qa/check-ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/vlis-qa/node_modules
      - name: Save QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: vlis-ui-qa
          path: qa-output/
          retention-days: 14

  package:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - name: Check publishing source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/pages.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = 404 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'UI validation passed. Enable Settings > Pages > Source: GitHub Actions, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = 200 ]; then
            source_type=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("build_type", ""))' "$RUNNER_TEMP/pages.json")
            if [ "$source_type" = workflow ]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo 'UI validation passed. Select GitHub Actions as the Pages publishing source, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Pages metadata request failed with HTTP $status" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.enabled == 'true'
      - name: Prepare static demo
        if: steps.source.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp docs/index.html docs/.nojekyll _site/
          cp -R docs/assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        if: steps.source.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: package
    if: needs.package.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
